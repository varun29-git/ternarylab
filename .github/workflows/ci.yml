name: Source-only checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python -m compileall -q src reports/30b
      - run: python -m unittest discover -s src/tests
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - run: python reports/30b/check_consistency.py
      - run: python src/parameter_report.py
      - run: bash -n src/run_h100_e2e.sh src/setup_azure_h100_vm.sh
