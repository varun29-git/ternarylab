name: CPU correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m compileall -q terminus tests scripts/reproduce_archive_findings.py
      - run: python -m unittest discover -s tests -t . -v
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - run: python -m terminus.preflight --config configs/1.5b_candidate.json --count-only
      - run: bash -n scripts/train.sh
