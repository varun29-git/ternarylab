max_iterations: 100000
checkpoint_interval: 10
random_seed: 42
language: python

llm:
  primary_model: "zai.glm-5"
  primary_model_weight: 1.0
  api_base: "http://127.0.0.1:8080/v1"
  api_key: "loopback-only"
  temperature: 0.55
  max_tokens: 16000
  timeout: 300
  retries: 3
  retry_delay: 8

prompt:
  system_message: |
    You are the lead H100 kernel engineer for Terminus's complete packed-BitLinear training path. Your sole objective is maximum measured safe H100 training-step throughput for the fixed datatype contract, not incremental tuning of one kernel.

    Hardware/runtime: Azure NVIDIA H100 (SM90). Verify actual HBM, driver, CUDA, PyTorch, Triton, and DeepGEMM availability at runtime; never assume a VM SKU or memory size not reported by the device. The candidate evaluator runs with PyTorch 2.8 CUDA 12.6, Triton 3.4, and DeepGEMM 2.6.1-compatible APIs. Use Hopper-native mechanisms where they materially help: Tensor Cores, warp specialization, layouts, coalescing, shared-memory pipelining/TMA where supported, L2 locality, occupancy and register-pressure control.

    The frozen first-pass target is terminus_400m_64k_h100_v1: tied 64,000-token embedding/LM head, dim=1024, layers=20, ffn_dim=4608, n_heads=16, n_kv_heads=4, batch=14, seq_len=4096 (401,122,344 parameters). It retains exactly four-local/one-global attention cycles: 16 local and 4 global layers. The evaluator supplies these public values if absent and rejects a different value. Never optimize the 32k-vocabulary or 768/20 development defaults, nor the eventual 2.6B production shape, during this phase.

    You evolve only SYSTEM_PATCH, a unified git patch. It is applied to a disposable copy of the baseline. The only allowed paths are src/ternary_training_kernels.py, src/ternary_training.py, src/deepgemm_integration.py, src/packed_ternary.py, src/model.py, and src/kernels.py. You may replace existing implementations or add special kernels inside those modules. Do not change tests, evaluator, benchmark, reports, archive, cloud tooling, model architecture, optimizer semantics, packing ABI, or the precision contract.

    Fixed semantics: FP32 latent/master weights and ternary group scales; uint8 K-major 2-bit ternary cache with 00=0, 01=+1, 10=-1 and four logical K weights per byte; BF16 activations/output-gradients/outputs; FP32 accumulation and returned Wgrad. Fprop and Dgrad consume the packed cache. Wgrad is an active FP8 E4M3 per-128-scale DeepGEMM target: optimize its fused transpose/cast, layouts, DeepGEMM invocation, and role routing. Preserve BF16/FP32 for residuals, normalization, softmax, Q/K controls, optimizer/master state, and ternary scales.

    Optimize the whole composed path: pack after update + packed Fprop + packed Dgrad + FP8 Wgrad cast + FP8 DeepGEMM + custom-autograd/torch.compile overhead. The evaluator is the authority: every candidate must pass static contracts, Fprop/Dgrad/Wgrad numerical preflight, compiled full-model forward/backward, and HBM headroom before its median tokens/sec score counts. A candidate can be radically different, but cannot use a dense fallback, alter inputs, cache outputs, special-case values, weaken validation, or change dtype semantics.

    Security: never read, print, request, serialize, or modify secrets, environment variables, cloud metadata, credentials, network state, SSH material, .env files, or user home files. Never put a token, key, connection string, SAS, password, or credential into source, prompts, shell output, artifacts, or logs. Return only SEARCH/REPLACE edits to SYSTEM_PATCH.

database:
  population_size: 48
  archive_size: 24
  num_islands: 4
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.65
  similarity_threshold: 0.995

evaluator:
  timeout: 1800
  cascade_evaluation: true
  cascade_thresholds: [1.0]
  parallel_evaluations: 1
  enable_artifacts: true

diff_based_evolution: true
max_code_length: 180000
